<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Study Streak</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f3ff;
      color: #111827;
    }

    .app {
      min-height: 100vh;
      padding-bottom: 80px;
    }

    /* Header */
    .header {
      background: #6d28d9;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 21px;
      font-weight: bold;
    }

    .profile {
      width: 40px;
      height: 40px;
      background: white;
      color: #6d28d9;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
    }

    /* Main */
    .container {
      max-width: 700px;
      margin: auto;
      padding: 22px 16px;
    }

    .hello {
      font-size: 27px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 20px;
    }

    /* Streak */
    .streak-box {
      background: #6d28d9;
      color: white;
      border-radius: 24px;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(109, 40, 217, 0.25);
    }

    .fire {
      font-size: 50px;
      margin-bottom: 5px;
    }

    .streak-number {
      font-size: 52px;
      font-weight: bold;
      line-height: 1;
    }

    .streak-text {
      margin-top: 8px;
      opacity: 0.9;
    }

    /* Cards */
    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-top: 16px;
      border: 1px solid #e5e7eb;
    }

    .card-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .study-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .study-title {
      font-weight: bold;
    }

    .study-description {
      color: #6b7280;
      font-size: 14px;
      margin-top: 5px;
      line-height: 1.4;
    }

    .complete-btn {
      border: none;
      background: #6d28d9;
      color: white;
      padding: 12px 16px;
      border-radius: 13px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    .complete-btn.completed {
      background: #16a34a;
    }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat {
      background: #f5f3ff;
      border-radius: 14px;
      padding: 15px 5px;
      text-align: center;
    }

    .stat-number {
      font-size: 23px;
      font-weight: bold;
      display: block;
    }

    .stat-label {
      color: #6b7280;
      font-size: 12px;
      margin-top: 4px;
      display: block;
    }

    /* Calendar */
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 7px;
    }

    .day {
      aspect-ratio: 1;
      border-radius: 9px;
      background: #eeeeF2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .day.completed {
      background: #7c3aed;
      color: white;
      font-weight: bold;
    }

    .day.today {
      outline: 2px solid #111827;
      outline-offset: 2px;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-around;
      padding: 9px 5px;
      z-index: 100;
    }

    .nav-item {
      border: none;
      background: transparent;
      color: #6b7280;
      font-size: 12px;
      cursor: pointer;
      padding: 5px 15px;
      line-height: 1.5;
    }

    .nav-item.active {
      color: #6d28d9;
      font-weight: bold;
    }

    /* Mobile */
    @media (max-width: 450px) {

      .hello {
        font-size: 24px;
      }

      .streak-number {
        font-size: 48px;
      }

      .study-row {
        align-items: flex-end;
      }

      .complete-btn {
        padding: 10px 12px;
        font-size: 13px;
      }

      .nav-item {
        padding: 5px 10px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="logo">
        📚 Study Streak
      </div>

      <div class="profile">
        P
      </div>
    </header>


    <!-- Main Content -->
    <main class="container">

      <h1 class="hello">
        Hey, Pratis 👋
      </h1>

      <p class="subtitle">
        Keep your study streak alive.
      </p>


      <!-- Streak -->
      <section class="streak-box">

        <div class="fire">
          🔥
        </div>

        <div class="streak-number" id="streakNumber">
          12
        </div>

        <div class="streak-text">
          Days Current Streak
        </div>

      </section>


      <!-- Today's Study -->
      <section class="card">

        <h2 class="card-title">
          Today's Study
        </h2>

        <div class="study-row">

          <div>
            <div class="study-title" id="studyStatus">
              Not completed yet
            </div>

            <div class="study-description">
              Tap once when you finish studying today.
            </div>
          </div>

          <button
            class="complete-btn"
            id="completeButton"
            onclick="completeStudy()"
          >
            Complete ✓
          </button>

        </div>

      </section>


      <!-- Progress -->
      <section class="card">

        <h2 class="card-title">
          Your Progress
        </h2>

        <div class="stats">

          <div class="stat">
            <span class="stat-number" id="currentStreak">
              12
            </span>

            <span class="stat-label">
              Current
            </span>
          </div>

          <div class="stat">
            <span class="stat-number">
              28
            </span>

            <span class="stat-label">
              Best Streak
            </span>
          </div>

          <div class="stat">
            <span class="stat-number">
              84h
            </span>

            <span class="stat-label">
              Total Study
            </span>
          </div>

        </div>

      </section>


      <!-- Calendar -->
      <section class="card">

        <h2 class="card-title">
          October 2026
        </h2>

        <div
          class="calendar"
          id="calendar"
        ></div>

      </section>

    </main>


    <!-- Bottom Navigation -->
    <nav class="bottom-nav">

      <button class="nav-item active">
        🏠
        <br>
        Home
      </button>

      <button class="nav-item">
        🔥
        <br>
        Streak
      </button>

      <button class="nav-item">
        📅
        <br>
        Calendar
      </button>

      <button class="nav-item">
        👤
        <br>
        Profile
      </button>

    </nav>

  </div>


  <script>

    /* =========================
       TODAY'S STUDY
    ========================= */

    const studyKey = "studyCompleted";

    function loadStudyStatus() {

      const completed =
        localStorage.getItem(studyKey) === "true";

      const button =
        document.getElementById("completeButton");

      const status =
        document.getElementById("studyStatus");

      if (completed) {

        button.textContent = "Completed ✓";

        button.classList.add("completed");

        status.textContent =
          "Today's study completed 🎉";

      } else {

        button.textContent = "Complete ✓";

        button.classList.remove("completed");

        status.textContent =
          "Not completed yet";

      }
    }


    function completeStudy() {

      const current =
        localStorage.getItem(studyKey) === "true";

      localStorage.setItem(
        studyKey,
        current ? "false" : "true"
      );

      loadStudyStatus();

    }


    /* =========================
       CALENDAR
    ========================= */

    function createCalendar() {

      const calendar =
        document.getElementById("calendar");

      for (let day = 1; day <= 31; day++) {

        const element =
          document.createElement("div");

        element.className = "day";

        /*
          Demo:
          First 12 days are completed.
        */

        if (day <= 12) {
          element.classList.add("completed");
        }

        /*
          29 October = today
        */

        if (day === 29) {
          element.classList.add("today");
        }

        element.textContent = day;

        calendar.appendChild(element);

      }

    }


    /* =========================
       START APP
    ========================= */

    loadStudyStatus();

    createCalendar();

  </script>

</body>
  </html>
